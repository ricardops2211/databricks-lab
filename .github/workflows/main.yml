name: Run from Jira

on:
  repository_dispatch:
    types: [jira-webhook]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch }}

      - name: Debug branch
        run: echo "Ejecutando en rama ${{ github.event.client_payload.branch }}"
