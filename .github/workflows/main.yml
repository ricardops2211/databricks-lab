name: GHActions - Jira ITSM - Richie

on:
  repository_dispatch:
    types: [jira-transition]
  workflow_dispatch:
    inputs:
      issue_key:
        description: "Clave del ticket Jira (ej: KAN-3)"
        required: true
      branch_name:
        description: "Rama asociada al ticket (ej: release/KAN-3)"
        required: true

env:
  JIRA_URL: "https://marketingpachas.atlassian.net"
  JIRA_PROJECT: "KAN"   # clave del proyecto Jira

jobs:
  jira-itsm-workflow:
    runs-on: self-hosted

    steps:
      - name: Determinar branch e issue
        id: vars
        run: |
          if [ -n "${{ github.event.client_payload.branch_name }}" ]; then
            echo "branch=${{ github.event.client_payload.branch_name }}" >> $GITHUB_OUTPUT
            echo "issue=${{ github.event.client_payload.issue_key }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.event.inputs.branch_name }}" >> $GITHUB_OUTPUT
            echo "issue=${{ github.event.inputs.issue_key }}" >> $GITHUB_OUTPUT
          fi

      # 🔹 Paso 0: Checkout del repo en la rama del ticket
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.branch }}

      - name: Login en Vault
        shell: bash
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_SKIP_VERIFY: "true"
          PATH: ${{ env.PATH }}:/home/gha-runner/vault
        run: |
          set -Eeuo pipefail
          vault --version
          vault login "$VAULT_TOKEN" >/dev/null
          vault token lookup

      - name: Obtener credenciales Jira
        id: get-jira
        shell: bash
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_SKIP_VERIFY: "true"
          PATH: ${{ env.PATH }}:/home/gha-runner/vault
        run: |
          jiraAuth=$(vault kv get -field=JIRA_AUTH secret/jira)
          echo "::add-mask::$jiraAuth"
          echo "JIRA_AUTH=$jiraAuth" >> "$GITHUB_ENV"

      - name: Validar conexión a Jira ITSM
        shell: bash
        run: |
          echo "🔎 Probando conexión a Jira Cloud en $JIRA_URL ..."
          curl -s -X GET \
            -H "Authorization: Basic $JIRA_AUTH" \
            -H "Accept: application/json" \
            "$JIRA_URL/rest/api/3/project" \
            | jq '.[] | {key, name, id}' || true

      - name: Crear historia en Jira desde JSON
        shell: bash
        env:
          JIRA_AUTH: ${{ env.JIRA_AUTH }}
          JIRA_URL: ${{ env.JIRA_URL }}
        run: |
          TICKET_FILE="tickets/story_001.json"
          echo "📂 Usando archivo: $TICKET_FILE"

          curl -X POST \
            -H "Authorization: Basic $JIRA_AUTH" \
            -H "Content-Type: application/json" \
            --data @"$TICKET_FILE" \
            "$JIRA_URL/rest/api/3/issue"
