name: Jira Transition

on:
  repository_dispatch:
    types: [jira-transition]

jobs:
  jira-transition-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rama del ticket
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch_name }}

      - name: Mostrar payload
        run: |
          echo "🔑 Issue Key: ${{ github.event.client_payload.issue_key }}"
          echo "🌿 Branch:   ${{ github.event.client_payload.branch_name }}"

      # 🔹 Aquí el curl manual dentro del workflow
      - name: Re-dispatch
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{
              "event_type": "sub-dispatch",
              "client_payload": {
                "issue_key": "${{ github.event.client_payload.issue_key }}",
                "branch_name": "${{ github.event.client_payload.branch_name }}"
              }
            }'
